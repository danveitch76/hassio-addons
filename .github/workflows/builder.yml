name: Docker Image CI - Build Release

env:
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs run"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
      publish_addons: ${{ steps.changed_addons.outputs.publish_addons }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Test build selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Select add-ons from the actual change range
        id: changed_addons
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/select_addons.py

  build:
    needs: init
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Prepare build
        id: prepare
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          ADDON: ${{ matrix.addon }}
        run: |
          config="${ADDON}/config.yaml"
          if ! yq -r '.arch[]' "$config" | grep -Fxq "$ARCH"; then
            echo "${ARCH} is not a valid architecture for ${ADDON}; skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image_template="$(yq -r '.image' "$config")"
          image="${image_template//\{arch\}/${ARCH}}"
          build_from=$(yq -r ".build_from.${ARCH}" "${ADDON}/build.yaml")
          if [[ -z "${build_from}" || "${build_from}" == "null" ]]; then
            echo "::error::No build_from image is defined for ${ARCH} in ${ADDON}/build.yaml"
            exit 1
          fi

          echo "build_arch=true" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"
          echo "version=$(yq -r '.version' "$config")" >> "$GITHUB_OUTPUT"
          echo "name=$(yq -r '.name' "$config")" >> "$GITHUB_OUTPUT"
          echo "description=$(yq -r '.description' "$config")" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date --rfc-3339=seconds --utc)" >> "$GITHUB_OUTPUT"
          {
            echo "extra_args<<DANOS_BUILD_ARGS"
            yq -o=json '.args // {}' "${ADDON}/build.yaml" | python3 -c 'import json, sys; args = json.load(sys.stdin); print("\n".join(str(key) + "=" + str(value) for key, value in args.items()))'
            echo "DANOS_BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"

      - name: Enable aarch64 emulation
        if: steps.prepare.outputs.build_arch == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build ${{ matrix.addon }} add-on
        if: steps.prepare.outputs.build_arch == 'true'
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        with:
          arch: ${{ matrix.arch }}
          cache-gha-scope: ${{ matrix.addon }}-${{ matrix.arch }}
          load: ${{ github.event_name != 'push' || !contains(fromJSON(needs.init.outputs.publish_addons), matrix.addon) }}
          build-args: |
            BUILD_DATE=${{ steps.prepare.outputs.build_date }}
            ${{ steps.prepare.outputs.extra_args }}
            BUILD_FROM=${{ steps.prepare.outputs.build_from }}
            BUILD_NAME=${{ steps.prepare.outputs.name }}
            BUILD_DESCRIPTION=${{ steps.prepare.outputs.description }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REF=${{ github.sha }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ matrix.addon }}"
          cosign: ${{ github.event_name == 'push' && contains(fromJSON(needs.init.outputs.publish_addons), matrix.addon) && 'true' || 'false' }}
          image: ${{ steps.prepare.outputs.image }}
          image-tags: |
            ${{ steps.prepare.outputs.version }}
          push: ${{ github.event_name == 'push' && contains(fromJSON(needs.init.outputs.publish_addons), matrix.addon) && 'true' || 'false' }}
          version: ${{ steps.prepare.outputs.version }}

      - name: Verify validation image architecture
        if: steps.prepare.outputs.build_arch == 'true' && (github.event_name != 'push' || !contains(fromJSON(needs.init.outputs.publish_addons), matrix.addon))
        shell: bash
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(docker image inspect "$IMAGE:$VERSION" --format '{{.Architecture}}')"
          test "$actual" = "arm64"
          echo "Validated image architecture: $actual"
